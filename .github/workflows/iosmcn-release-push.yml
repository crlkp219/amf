name: IOSMCN Release Workflow

on:
  workflow_dispatch:

jobs:
  docker-build-push-images:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      DOCKER_REGISTRY: ghcr.io/
      DOCKER_REPOSITORY: crlkp219/
      RELEASE_VERSION: 0.3.2.rc1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - run: echo GIT_SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_ENV

      - uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCRUSER }}
          password: ${{ secrets.GHCRPASS }}

      # --- ADDED FOR PRIVATE DEPENDENCIES ---
      - name: Configure Git for Private Modules
        run: |
          # 1. Direct Go to bypass public proxy for your organization's modules
          go env -w GOPRIVATE="github.com/ios-mcn-core/*"
          
          # 2. Authenticate git fetches using your PAT token
          # Note: Make sure to add MY_GITHUB_TOKEN to your repo secrets!
          git config --global url."https://${{ secrets.MY_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # --------------------------------------

      - name: Clean Checksum
        run: go mod tidy

      - name: Build Docker image
        env:
          DOCKER_TAG: release-${{ env.RELEASE_VERSION }}
        run: |
          make docker-build

      - name: Push Docker image latest to Github
        env:
          DOCKER_TAG: release-${{ env.RELEASE_VERSION }}
        run: |
          make docker-push
